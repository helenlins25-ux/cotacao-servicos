# Configuracao de deploy para o Render (https://render.com)
# Conecte o repositorio no Render (Blueprint) que ele le este arquivo.
services:
  - type: web
    name: cotacao-servicos
    runtime: node
    plan: free
    buildCommand: "npm install"   # instala a dependencia 'pg' (driver PostgreSQL)
    startCommand: "node --experimental-sqlite src/server.js"

    envVars:
      - key: NODE_VERSION
        value: "22"
      # Conexao com o banco Supabase (PostgreSQL). DEFINA no painel do Render
      # (Environment) com a string do seu projeto Supabase. NAO versionar no git.
      - key: DATABASE_URL
        sync: false
      # Modo de e-mail: comeca simulado; troque para "smtp" quando tiver credenciais.
      - key: MAIL_MODE
        value: mock
      # URL publica (o app detecta sozinho; pode fixar apos o 1o deploy)
      - key: BASE_URL
        sync: false
      # Preencha quando ativar o envio real (MAIL_MODE=smtp):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
